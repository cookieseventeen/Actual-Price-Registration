# 基礎定義（dev / prod 共用）
#   postgres / redis：無 profile → 永遠啟動
#   api / nginx：profile "prod"        cloudflared：profile "tunnel"
#
#   開發：docker compose up -d                （只起 DB+Redis，見 override）
#   正式：docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile prod up -d --build
#   接通道：上一行再加 --profile tunnel（需先在 .env 填 CLOUDFLARE_TUNNEL_TOKEN）
name: shijiatong

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shijiatong}
      POSTGRES_USER: ${POSTGRES_USER:-shijiatong}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shijiatong}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shijiatong} -d ${POSTGRES_DB:-shijiatong}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [shijiatong-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [shijiatong-net]

  api:
    build:
      context: ./src/Shijiatong.Api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-shijiatong};Username=${POSTGRES_USER:-shijiatong};Password=${POSTGRES_PASSWORD:-shijiatong}"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [shijiatong-net]
    profiles: [prod]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [shijiatong-net]
    profiles: [prod]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      - nginx
    restart: unless-stopped
    networks: [shijiatong-net]
    profiles: [tunnel]

volumes:
  pgdata:
  redisdata:

networks:
  shijiatong-net:
    driver: bridge
