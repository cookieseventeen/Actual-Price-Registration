upstream shijiatong_api {
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css image/svg+xml;

    # 前端靜態檔（dist 由 compose 掛入）
    root /usr/share/nginx/html;
    index index.html;

    # ── 後端 API：/api/ 與 /health 反向代理到 ASP.NET ──
    location /api/ {
        proxy_pass http://shijiatong_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /health {
        access_log off;
        proxy_pass http://shijiatong_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── 前端靜態資源（vite 檔名帶 hash，可長快取）──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA：其餘路徑回 index.html（前端走 client-side view 切換）──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
